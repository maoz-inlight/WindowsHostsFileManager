name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Test
        run: dotnet test --no-restore --configuration Release --verbosity normal
      - name: Build desktop app
        run: dotnet build src/HostsManager/HostsManager.csproj --no-restore --configuration Release
  package:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and verify packages
        run: ./installer/build.ps1 -Architectures ${{ matrix.arch }}
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: |
            dist/HostsManager-*-${{ matrix.arch }}-Setup.msi
            dist/HostsManager-*-${{ matrix.arch }}-Portable.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
